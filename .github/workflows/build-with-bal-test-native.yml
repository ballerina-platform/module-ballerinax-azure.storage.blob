name: GraalVM Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  call_stdlib_workflow:
    name: Run StdLib Workflow
    if: ${{ github.event_name != 'schedule' || (github.event_name == 'schedule' && github.repository_owner == 'ballerina-platform') }}
    uses: ballerina-platform/ballerina-library/.github/workflows/build-with-bal-test-graalvm-connector-template.yml@main
    with:
      # The gradle build starts Azurite and, on CI, leaves it running for the GraalVM test
      # step that follows; the tests themselves run once, in that step.
      additional-build-flags: "-x test"
