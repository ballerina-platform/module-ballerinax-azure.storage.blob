services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    command: azurite --blobHost 0.0.0.0 --blobPort 10000 --queueHost 0.0.0.0 --queuePort 10001 --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
    healthcheck:
      # The image ships busybox tools; an accepted TCP connection is the readiness signal.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 && nc -z 127.0.0.1 10001"]
      interval: 2s
      timeout: 5s
      retries: 30
