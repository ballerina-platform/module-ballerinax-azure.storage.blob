apply plugin: 'java'

task testExamples {
    doLast {
        try {
            exec {
                workingDir project.projectDir
                // The script is bash (shebang); running it through the interpreter works on
                // every platform with bash on the path (Git Bash on Windows) and needs no
                // execute bit.
                commandLine 'bash', './build.sh', 'run'
            }
        } catch (Exception e) {
            println("Example run failed: " + e.message)
            throw e
        }
    }
}

task buildExamples {
    gradle.taskGraph.whenReady { graph ->
        if (graph.hasTask(":azure.storage.blob-examples:test")) {
            buildExamples.enabled = false
        } else {
            testExamples.enabled = false
        }
    }
    doLast {
        try {
            exec {
                workingDir project.projectDir
                commandLine 'bash', './build.sh', 'build'
            }
        } catch (Exception e) {
            println("Example build failed: " + e.message)
            throw e
        }
    }
}

buildExamples.dependsOn ":azure.storage.blob-ballerina:build"
testExamples.dependsOn ":azure.storage.blob-ballerina:build"
