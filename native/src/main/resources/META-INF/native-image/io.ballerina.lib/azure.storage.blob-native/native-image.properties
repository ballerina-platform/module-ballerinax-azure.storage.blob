# azure-core initializes com.azure.core.util.Configuration at build time, and its logger lookup
# binds to the slf4j JUL adapter that ballerina-rt provides, so the adapter must be built in too.
# Netty's JdkSslServerContext initializer allocates buffers that netty marks run-time only.
Args = --initialize-at-build-time=org.slf4j.jul.JDK14LoggerAdapter,org.slf4j.jul.JDK14LoggerAdapter$1 \
       --initialize-at-run-time=io.netty.handler.ssl.JdkSslServerContext
