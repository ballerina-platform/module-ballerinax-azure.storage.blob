# azure-core initializes com.azure.core.util.Configuration at build time, and its logger lookup
# binds through SLF4J 2 (which Ballerina 2201.14 ships) to the JUL adapter in ballerina-rt; the
# binding leaves SLF4J's provider and factory objects in the image heap, so the org.slf4j
# package is built in as a whole (the http module does the same). azure-core also builds
# Jackson's Base64Variants table in but not the variant class of the objects it holds.
# The Netty run-time list is the http module's for the same Netty 4.2.18: JdkSslServerContext
# allocates buffers that netty marks run-time only, and the OpenSSL-binding classes call into
# the tcnative native library (not shipped) from their static initializers.
# The QUIC and HTTP/3 codecs are on the classpath only because Reactor Netty 1.3 probes for
# them at start-up; their static initializers load a native library that is not shipped, so
# both packages initialize at run time, where the probe reports them unavailable.
# The two -J flags go to the image builder's JVM: with Unsafe memory access allowed and
# java.nio opened, Netty 4.2 settles on its Unsafe-based cleaner at build time instead of the
# foreign-memory CleanerJava24Linker, whose malloc downcall GraalVM cannot compile
# (netty/netty#16626); the http module's native-image properties carry the same pair.
Args = --initialize-at-build-time=org.slf4j,com.fasterxml.jackson.core.Base64Variant,com.fasterxml.jackson.core.Base64Variant$PaddingReadBehaviour,com.fasterxml.jackson.core.Base64Variants \
       --initialize-at-run-time=io.netty.handler.codec.compression.ZstdOptions \
       --initialize-at-run-time=io.netty.handler.codec.http2.Http2ServerUpgradeCodec \
       --initialize-at-run-time=io.netty.handler.ssl.BouncyCastleAlpnSslUtils \
       --initialize-at-run-time=io.netty.handler.ssl.JdkSslServerContext \
       --initialize-at-run-time=io.netty.handler.ssl.OpenSsl \
       --initialize-at-run-time=io.netty.handler.ssl.OpenSslPrivateKeyMethod \
       --initialize-at-run-time=io.netty.handler.ssl.OpenSslAsyncPrivateKeyMethod \
       --initialize-at-run-time=io.netty.handler.ssl.JdkDelegatingPrivateKeyMethod \
       --initialize-at-run-time=io.netty.handler.ssl.ReferenceCountedOpenSslEngine \
       --initialize-at-run-time=io.netty.internal.tcnative.AsyncSSLPrivateKeyMethod \
       --initialize-at-run-time=io.netty.internal.tcnative.CertificateCompressionAlgo \
       --initialize-at-run-time=io.netty.internal.tcnative.CertificateVerifier \
       --initialize-at-run-time=io.netty.internal.tcnative.SSL \
       --initialize-at-run-time=io.netty.internal.tcnative.SSLPrivateKeyMethod \
       --initialize-at-run-time=io.netty.handler.codec.quic,io.netty.handler.codec.http3 \
       -J--add-opens=java.base/java.nio=ALL-UNNAMED \
       -J--sun-misc-unsafe-memory-access=allow
